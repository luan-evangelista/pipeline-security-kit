rules:
  - id: jwt-hardcoded-secret
    message: >-
      JWT signed or verified with a hardcoded secret. Anyone who reads the code can
      forge tokens. Load the key from a secret manager or environment variable.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
    pattern-either:
      - pattern: $JWT.sign($PAYLOAD, "...", ...)
      - pattern: $JWT.verify($TOKEN, "...", ...)
  - id: jwt-hardcoded-secret-go
    message: >-
      JWT signed with a hardcoded key. Anyone who reads the code can forge tokens.
      Load the key from a secret manager or environment variable.
    severity: ERROR
    languages: [go]
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
    pattern-either:
      - pattern: $TOKEN.SignedString([]byte("..."))
      - patterns:
          - pattern-inside: |
              $KEY := []byte("...")
              ...
          - pattern: $TOKEN.SignedString($KEY)
      - patterns:
          - pattern-inside: |
              var $KEY = []byte("...")
              ...
          - pattern: $TOKEN.SignedString($KEY)
