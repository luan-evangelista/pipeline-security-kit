rules:
  - id: tls-verification-disabled
    message: >-
      TLS certificate verification is disabled. Any machine in the path can read
      or change this traffic. Fix the certificate chain instead (PCI DSS req. 4.2.1).
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      category: security
      cwe: "CWE-295: Improper Certificate Validation"
    pattern-either:
      - pattern: |
          { ..., rejectUnauthorized: false, ... }
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: process.env["NODE_TLS_REJECT_UNAUTHORIZED"] = "0"
  - id: tls-verification-disabled-go
    message: >-
      InsecureSkipVerify disables TLS certificate verification. Fix the certificate
      chain or pin a CA pool instead (PCI DSS req. 4.2.1).
    severity: ERROR
    languages: [go]
    metadata:
      category: security
      cwe: "CWE-295: Improper Certificate Validation"
    pattern: |
      tls.Config{..., InsecureSkipVerify: true, ...}
