rules:
  - id: weak-password-hash-go
    message: >-
      MD5 and SHA-1 are fast hashes and unsafe for passwords: GPUs try billions per
      second. Use bcrypt, scrypt or Argon2id (golang.org/x/crypto).
    severity: ERROR
    languages: [go]
    metadata:
      category: security
      cwe: "CWE-916: Use of Password Hash With Insufficient Computational Effort"
    pattern-either:
      - pattern: md5.Sum(...)
      - pattern: md5.New()
      - pattern: sha1.Sum(...)
      - pattern: sha1.New()
  - id: weak-password-hash
    message: >-
      MD5 and SHA-1 are unsafe for passwords and integrity checks. Use bcrypt,
      scrypt or Argon2id for passwords and SHA-256 or better elsewhere.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      category: security
      cwe: "CWE-916: Use of Password Hash With Insufficient Computational Effort"
    pattern-either:
      - pattern: $CRYPTO.createHash("md5")
      - pattern: $CRYPTO.createHash("sha1")
